openapi: 3.0.3
info:
  title: Nav Rest API (Swagger UI)
  description: "A swagger UI variant of nav_rest_api to allow controlling of TurtleBot3 via API calls."
  termsOfService: http://cardboardcode.github.io/
  contact:
    email: beyhy94@gmail.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.11
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
- url: https://petstore3.swagger.io/api/v3
tags:
- name: user
  description: Operations about Robot
paths:
  /system/ping:
    get:
      tags:
      - user
      summary: Allow external clients to ping and verify if system is online.
      description: Allow verification by external client to verify if system is online.
      operationId: ping_system
      responses:
        "200":
          description: Successful operation
        "400":
          description: Connection is successful but something went wrong.
        "404":
          description: System is offline.
      x-openapi-router-controller: swagger_server.controllers.user_controller
  /test_publish:
    post:
      tags:
      - user
      summary: Publish simple string for 1 minute
      description: This can only be done by the logged in user.
      operationId: publish_ros1_string
      requestBody:
        description: Created temporary ROS 1 string publisher
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ROS1String'
      responses:
        default:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ROS1String'
      x-openapi-router-controller: swagger_server.controllers.user_controller
  /robot/{robot_id}/goal:
    post:
      tags:
      - user
      summary: Send navigation goal to Robot
      parameters:
      - name: robot_id
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: tb3_0
      description: Robot will move to input navigational goal.
      operationId: send_nav_goal
      requestBody:
        description: Send navigational goal
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Position'
      responses:
        default:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
      x-openapi-router-controller: swagger_server.controllers.user_controller
  /robot/{robot_id}/stop:
    get:
      tags:
        - user
      summary: Cancel current navigation task of Robot.
      parameters:
      - name: robot_id
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: tb3_0
      description: Robot's current navigation task can be cancelled.
      operationId: stop_robot
      responses:
        "200":
          description: Successful operation
        "400":
          description: Connection is successful but something went wrong.
        "404":
          description: Robot not found
      x-openapi-router-controller: swagger_server.controllers.user_controller
  /robot/{robot_id}/status:
    get:
      tags:
      - user
      summary: Get status information of robot
      parameters:
      - name: robot_id
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: tb3_0
      description: ""
      operationId: get_robot_status
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "400":
          description: Connection is successful but something went wrong.
        "404":
          description: Robot not found
      x-openapi-router-controller: swagger_server.controllers.user_controller
  /robot/{robot_id}/pose:
    get:
      tags:
      - user
      summary: Get position and orientation of robot
      parameters:
      - name: robot_id
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: tb3_0
      description: ""
      operationId: get_robot_position
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
        "400":
          description: Connection is successful but something went wrong.
        "404":
          description: Robot not found
      x-openapi-router-controller: swagger_server.controllers.user_controller
  /robot/{robot_id}/dock:
    get:
      tags:
      - user
      summary: Command Robot to return to Dock (home)
      parameters:
      - name: robot_id
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: tb3_0
      description: ""
      operationId: dock_robot
      responses:
        "200":
          description: Successful operation
        "400":
          description: Connection is successful but something went wrong.
        "404":
          description: Robot not found
      x-openapi-router-controller: swagger_server.controllers.user_controller
  /robot/{robot_id}/localise:
    post:
      tags:
      - user
      summary: Localise Robot
      parameters:
      - name: robot_id
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: tb3_0
      description: Robot will localise to input initial pose.
      operationId: localise_robot
      requestBody:
        description: Send new initial pose
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Position'
      responses:
        default:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
      x-openapi-router-controller: swagger_server.controllers.user_controller

components:
  schemas:
    Status:
      type: object
      properties:
        map_name:
          type: string
          example: "test_map_name"
        battery:
          type: number
          example: 0.9
        navigation_status:
          type: number
          example: 1
        msg:
          type: string
          example: "Goal has reached."
      xml:
        name: position
    Position:
      type: object
      properties:
        location_x:
          type: number
          example: 3.80250850120499
        location_y:
          type: number
          example: 1.0450816557708476
        location_th:
          type: number
          example: 1.5707
      xml:
        name: position
    Twist:
      type: object
      properties:
        linear_speed:
          type: number
          example: 0.0
        angular_speed:
          type: number
          example: 0.0
      xml:
        name: twist
    ROS1String:
      type: object
      properties:
        msg:
          type: string
          example: "test_message"
      xml:
        name: ros_string
  requestBodies:
    Position:
      description: Position object to be used for robot position
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Position'
        application/xml:
          schema:
            $ref: '#/components/schemas/Position'
    Status:
      description: Status object to be used for robot status
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Status'
        application/xml:
          schema:
            $ref: '#/components/schemas/Status'
  securitySchemes:
    petstore_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://petstore3.swagger.io/oauth/authorize
          scopes:
            write:pets: modify pets in your account
            read:pets: read your pets
      x-tokenInfoFunc: swagger_server.controllers.authorization_controller.check_petstore_auth
      x-scopeValidateFunc: swagger_server.controllers.authorization_controller.validate_scope_petstore_auth
    api_key:
      type: apiKey
      name: api_key
      in: header
      x-apikeyInfoFunc: swagger_server.controllers.authorization_controller.check_api_key

